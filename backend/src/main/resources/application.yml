spring:
  application:
    name: devpilot
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/devpilot}
    username: ${DATABASE_USER:devpilot}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
  max-http-request-header-size: 16KB
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
logging:
  structured:
    format:
      console: logstash
app:
  indexing:
    workers: ${INDEXING_WORKERS:1}
    poll-ms: ${INDEXING_POLL_MS:2000}
    lease-seconds: ${INDEXING_LEASE_SECONDS:300}
  repository-context:
    max-chars: ${REPOSITORY_CONTEXT_MAX_CHARS:24000}
  retrieval:
    max-limit: ${RETRIEVAL_MAX_LIMIT:50}
  source-chunking:
    # UTF-16 character counts, including LF; an oversized line remains intact.
    max-chars: ${SOURCE_CHUNKING_MAX_CHARS:4000}
    overlap-chars: ${SOURCE_CHUNKING_OVERLAP_CHARS:400}
  source-acquisition:
    # Bounded to 1 MiB to fit base64 blob responses in the existing GitHub client.
    max-file-bytes: ${SOURCE_ACQUISITION_MAX_FILE_BYTES:524288}
  jwt-secret: ${JWT_SECRET}
  encryption-key: ${ENCRYPTION_KEY}
  webhook-secret: ${WEBHOOK_SECRET}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  secure-cookies: ${SECURE_COOKIES:false}
  ai:
    mode: ${AI_MODE:local}
    api-key: ${AI_API_KEY:}
    # Blank values select the active provider's defaults; environment overrides apply to both.
    base-url: ${AI_BASE_URL:}
    model: ${AI_MODEL:}
  embedding:
    concurrency: ${EMBEDDING_CONCURRENCY:1}
    min-interval-ms: ${EMBEDDING_MIN_INTERVAL_MS:1000}
    max-attempts: ${EMBEDDING_MAX_ATTEMPTS:3}
    rate-limit-backoff-ms: ${EMBEDDING_RATE_LIMIT_BACKOFF_MS:2000}
    transient-backoff-ms: ${EMBEDDING_TRANSIENT_BACKOFF_MS:250}
    max-backoff-ms: ${EMBEDDING_MAX_BACKOFF_MS:60000}
    mode: ${EMBEDDING_MODE:disabled}
    api-key: ${EMBEDDING_API_KEY:}
    base-url: ${EMBEDDING_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    model: ${EMBEDDING_MODEL:gemini-embedding-2}
    dimensions: ${EMBEDDING_DIMENSIONS:768}
    timeout-seconds: ${EMBEDDING_TIMEOUT_SECONDS:20}
