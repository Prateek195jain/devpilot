services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devpilot
      POSTGRES_USER: devpilot
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run scripts/setup-env.py first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devpilot -d devpilot"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/devpilot
      DATABASE_USER: devpilot
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Run scripts/setup-env.py first}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Run scripts/setup-env.py first}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Run scripts/setup-env.py first}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      AI_MODE: ${AI_MODE:-local}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: .
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  postgres-data:
